version: '3.8'

services:
  # Web Application (PHP 8.2 + Apache)
  web:
    build: .
    container_name: cbt_web
    restart: unless-stopped
    ports:
      - "1000:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=cbt_db
      - DB_USER=postgres
      - DB_PASS=postgres
    depends_on:
      - db

  # Database PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: cbt_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=cbt_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - cbt_db_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

volumes:
  cbt_db_data:
