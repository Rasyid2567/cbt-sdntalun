version: '3.8'

services:
  # Web Application (PHP 8.2 + Apache)
  web:
    build: .
    image: cbt-sdntalun
    container_name: cbt_web
    restart: unless-stopped
    ports:
      - "1000:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_NAME=cbt_sdntalun
      - DB_USER=postgres
      - DB_PASS=postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
