; ==============================================================================
; Konfigurasi PHP Kustom untuk CBT SDN Talun 01
; Mengatasi batasan multipart form & input vars untuk paket soal skala besar
; ==============================================================================

; Tingkatkan limit form multipart dan variabel input (default PHP hanya 1000/1020)
max_input_vars = 10000
max_multipart_body_parts = 10000

; Batas ukuran upload berkas dan POST
upload_max_filesize = 64M
post_max_size = 64M

; Alokasi memori dan batas eksekusi
memory_limit = 256M
max_execution_time = 300

; Buffer output agar header HTTP tidak terkirim prematur jika ada peringatan startup
output_buffering = 4096
